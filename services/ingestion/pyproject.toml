# NOTE: The ingestion service reuses the shared app/ package from ai-orchestrator.
# In development, install it as an editable dependency by running:
#   pip install -e ../ai-orchestrator
# The Dockerfile for this service mounts ai-orchestrator/app onto PYTHONPATH.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opsintel-ingestion"
version = "0.1.0"
description = "OpsIntel RAG — Document Ingestion Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.3.0",
    "rank-bm25>=0.2.2",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
