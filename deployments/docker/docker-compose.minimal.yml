version: "3.9"

# ── Minimal dev stack ──────────────────────────────────────────────────────────
# Starts ONLY PostgreSQL and Qdrant.
# The AI Orchestrator runs locally (outside Docker) via: uvicorn app.main:app
#
# Usage:
#   cd opsintel-rag
#   cp .env.dev .env
#   docker compose -f deployments/docker/docker-compose.minimal.yml up -d
#   cd services/ai-orchestrator && uvicorn app.main:app --reload

networks:
  opsintel-dev:
    driver: bridge

volumes:
  postgres_dev_data:
  qdrant_dev_data:

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsintel
      POSTGRES_USER: opsintel
      POSTGRES_PASSWORD: devpassword
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsintel -d opsintel"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - opsintel-dev

  qdrant:
    image: qdrant/qdrant:v1.9.0
    restart: unless-stopped
    volumes:
      - qdrant_dev_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API + Dashboard UI
      - "6334:6334"   # gRPC
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - opsintel-dev
