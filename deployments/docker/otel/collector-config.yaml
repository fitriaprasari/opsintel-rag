receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  resource:
    attributes:
      - key: platform
        value: opsintel
        action: insert

exporters:
  # Forward to Kafka for internal consumption
  kafka:
    brokers:
      - kafka:9092
    topic: telemetry-raw
    encoding: otlp_json
  # Expose Prometheus metrics for scraping
  prometheus:
    endpoint: "0.0.0.0:8888"
  # Debug logging (dev only)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [kafka, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [kafka, prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [kafka, debug]
